[project]
name = "stockreport"
version = "1.0.0"
description = "Daily market + ticker breaking-news report summarized by a local Ollama model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "ollama>=0.4.7",
]

[project.scripts]
stockreport = "stockreport.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package lives at ./stockreport, not ./src/stockreport
module-root = ""
