# Tickers to include in the daily report (Yahoo Finance symbol format, e.g. BRK-B).
tickers:
  - META
  - MSFT
  - AMZN
  - SIVE.ST # Sivers Semiconductors, Nasdaq Stockholm
  - UBER
  - AMSC
  - NBIS
  - GOOGL
  - NOW
  - RDDT
  - ASML
  - D05.SI # DBS Group, SGX
  - U96.SI # Sembcorp Industries, SGX

# API key comes from the OPENROUTER_API_KEY environment variable (.env file).
openrouter:
  # Must be a free model (":free" suffix). Browse: https://openrouter.ai/models?max_price=0
  # Alternatives: meta-llama/llama-3.3-70b-instruct:free, openai/gpt-oss-120b:free
  model: "google/gemma-4-31b-it:free"
  # Tried in order when the model above is saturated (community free pools 429
  # often; the NVIDIA-hosted ones have dedicated capacity and tend to stay up).
  fallback_models:
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "nvidia/nemotron-3-nano-30b-a3b:free"
  # If the whole chain above is saturated, discover whatever free models are
  # live right now and try those too.
  dynamic_fallback: true
  timeout_seconds: 120
  temperature: 0.3
  max_tokens: 1500 # completion length cap per topic
  context_tokens: 32768 # prompt budgeting; current free models all offer at least this

news:
  lookback_hours: 24 # only include news newer than this
  max_articles_per_topic: 5 # top N most recent items per section
  max_chars_per_article: 1500
  request_timeout_seconds: 15
  # Drop items from a ticker's section when neither the title nor the snippet
  # mentions the ticker symbol or company name (Yahoo's "related news" is broad).
  require_ticker_mention: true
  # When a ticker has no news inside lookback_hours, show its N most recent
  # items instead, however old (0 disables this fallback).
  fallback_max_articles: 2
  # Use the model to screen Market Overview headlines: drop items that do not
  # affect markets (lifestyle trends, personal-finance advice, etc.) and rank
  # the rest by importance; the section shows the top ones.
  market_relevance_filter: true
  # How many market candidates the ranking gets to choose from (larger = covers
  # more of the day, slightly longer ranking prompt).
  market_candidate_pool: 30
  # Max market-pool items from any single publisher, so one outlet's
  # syndication burst can't crowd out the pool.
  market_source_cap: 2
  # Feeds used for the market-wide "Market Overview" section.
  market_feeds:
    - "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en"
    - "https://finance.yahoo.com/news/rssindex"
    - "https://www.cnbc.com/id/100003114/device/rss/rss.html"
    - "https://feeds.content.dowjones.io/public/rss/mw_topstories"

report:
  output_dir: "reports"
