name: Daily report

on:
  schedule:
    # 07:30 Singapore time (UTC+8). GitHub's scheduler can run 15-60 min late.
    - cron: "30 23 * * *"
  workflow_dispatch: # manual test runs from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and deliver the report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run stockreport --telegram

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/*.md
          if-no-files-found: ignore
          retention-days: 30
