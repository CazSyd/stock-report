name: Daily report

on:
  schedule:
    # 07:30 Singapore time (UTC+8). GitHub's scheduler can run 15-60 min late.
    - cron: "30 23 * * *"
  workflow_dispatch: # manual test runs from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # maintain the rolling "latest" release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and deliver the report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run stockreport --telegram

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/*.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish to the rolling "latest" release
        if: always() # a partial report is still worth publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls -t reports/*.md 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No report was produced; keeping the previous release."
            exit 0
          fi
          cp "$FILE" report.md
          # create the release once; afterwards only update it
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest daily report" --notes "(placeholder)"
          # the release page renders the report as a web page...
          gh release edit latest --title "Daily report $(date -u +%F)" --notes-file report.md
          # ...and the asset is the stable downloadable file
          gh release upload latest report.md --clobber

  workflow-keepalive:
    name: Keep scheduled workflow active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Prevent inactivity suspension
        uses: liskin/gh-workflow-keepalive@v1
